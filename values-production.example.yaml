# Copy this file to values-production.yaml and adjust it for the target cluster.
# Do not commit real production credentials.

global:
  imageRegistry: gengbo
  defaultStorageClass: local-path
  security:
    # Required by current Bitnami charts when using a mirrored/private registry.
    allowInsecureImages: true

mysql:
  enabled: true
  fullnameOverride: mysql
  image:
    repository: mysql
    tag: 9.4.0-debian-12-r1 # MySQL 9.4.0
  auth:
    rootPassword: root
    password: root
  primary:
    service:
      type: LoadBalancer

redis:
  enabled: true
  fullnameOverride: redis
  image:
    repository: redis
    tag: 8.2.1 # Redis 8.2.1
  auth:
    enabled: false
    password: ""
  master:
    service:
      type: LoadBalancer

postgresql:
  enabled: true
  fullnameOverride: postgresql
  image:
    repository: postgresql
    tag: 17.6.0-debian-12-r4 # PostgreSQL 17.6.0
  auth:
    postgresPassword: postgres
    password: postgres
  primary:
    service:
      type: LoadBalancer

elasticsearch:
  enabled: true
  fullnameOverride: elasticsearch
  image:
    repository: elasticsearch
    tag: 9.1.2-debian-12-r0 # Elasticsearch 9.1.2
  sysctlImage:
    repository: os-shell
    tag: 12-debian-12-r50
  security:
    enabled: false
    elasticPassword: ""
  service:
    type: LoadBalancer

mongodb:
  enabled: true
  fullnameOverride: mongodb
  image:
    repository: mongodb
    tag: 8.0.13 # MongoDB 8.0.13
  auth:
    enabled: true
    rootPassword: root
  service:
    type: LoadBalancer

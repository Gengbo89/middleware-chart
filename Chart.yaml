apiVersion: v2
name: middleware-chart
description: Umbrella Helm chart for middleware and database services
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - middleware
  - database
  - mysql
  - redis
  - postgresql
dependencies:
  - name: mysql
    version: 14.0.3
    repository: https://charts.bitnami.com/bitnami
    condition: mysql.enabled
  - name: redis
    version: 27.0.17
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: postgresql
    version: 18.8.0
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
